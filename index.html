<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ginko Tram">
    <link rel="manifest" href="manifest.json">
    <title>Ginko Tram — Besançon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --bg2: #12121a;
            --card: #16161f;
            --card2: #1c1c28;
            --border: rgba(255,255,255,0.05);
            --border2: rgba(255,255,255,0.08);
            --text: #f0f0f5;
            --text2: rgba(255,255,255,0.45);
            --text3: rgba(255,255,255,0.2);
            --t1: #00A5C2;
            --t1-dim: rgba(0,165,194,0.12);
            --t2: #006D78;
            --t2-dim: rgba(0,109,120,0.15);
            --left: #ff9f43;
            --left-dim: rgba(255,159,67,0.12);
            --right: #5f6cf5;
            --right-dim: rgba(95,108,245,0.12);
            --green: #00e09e;
            --green-dim: rgba(0,224,158,0.08);
            --green-glow: rgba(0,224,158,0.35);
            --red: #ff6b6b;
            --red-dim: rgba(255,107,107,0.08);
            --amber: #ffb347;
            --radius: 14px;
            --radius-sm: 8px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { background:var(--bg); }
        body {
            font-family:'Outfit',system-ui,sans-serif;
            background:var(--bg);
            color:var(--text);
            min-height:100dvh;
            -webkit-font-smoothing:antialiased;
            overflow-x:hidden;
        }
        body::before,body::after { content:''; position:fixed; pointer-events:none; z-index:0; }
        body::before { top:-30%; left:-20%; width:60%; height:60%; background:radial-gradient(ellipse,rgba(95,108,245,0.05) 0%,transparent 70%); }
        body::after { bottom:-20%; right:-20%; width:50%; height:50%; background:radial-gradient(ellipse,rgba(255,159,67,0.03) 0%,transparent 70%); }
        .app { position:relative; z-index:1; max-width:520px; margin:0 auto; padding-bottom:env(safe-area-inset-bottom,20px); }

        /* ── Header ── */
        .header { padding:16px 16px 12px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; background:var(--bg); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
        .brand { display:flex; align-items:center; gap:10px; }
        .brand-icon { width:34px; height:34px; background:linear-gradient(135deg,var(--green),#00b87a); border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:17px; box-shadow:0 4px 16px var(--green-glow); }
        .brand h1 { font-size:1.05rem; font-weight:700; letter-spacing:-0.03em; line-height:1.1; }
        .brand .sub { font-size:0.6rem; color:var(--text2); font-weight:400; letter-spacing:0.02em; }
        .header-right { display:flex; align-items:center; gap:6px; }
        .live-dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green-glow); animation:pulse 2.5s ease-in-out infinite; }
        .live-dot.offline { background:var(--text3); box-shadow:none; animation:none; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.5;transform:scale(.85);} }
        .update-time { font-family:'Space Mono',monospace; font-size:.65rem; color:var(--text2); }
        .hdr-btn { background:none; border:1px solid var(--border); border-radius:8px; padding:6px 8px; color:var(--text2); cursor:pointer; font-size:.65rem; transition:all .2s; text-decoration:none; display:flex; align-items:center; gap:3px; font-family:inherit; }
        .hdr-btn:hover { border-color:var(--border2); color:var(--text); }
        .hdr-btn.active { border-color:rgba(0,224,158,.3); color:var(--green); background:var(--green-dim); }
        .hdr-btn.info { border-color:rgba(255,107,107,.2); color:var(--red); font-weight:500; }

        /* ── Favorites bar ── */
        .fav-bar { padding:12px 16px 0; display:none; }
        .fav-bar.show { display:block; }
        .fav-bar-title { font-size:.6rem; color:var(--text3); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; font-weight:600; }
        .fav-chips { display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:4px; }
        .fav-chips::-webkit-scrollbar { display:none; }
        .fav-chip { flex-shrink:0; padding:6px 10px; background:var(--card); border:1px solid var(--border); border-radius:20px; font-size:.7rem; font-weight:500; color:var(--text2); cursor:pointer; transition:all .2s; white-space:nowrap; display:flex; align-items:center; gap:5px; }
        .fav-chip:hover { border-color:var(--border2); color:var(--text); }
        .fav-chip .fc-name { color:var(--text); }
        .fav-chip .fc-time { font-family:'Space Mono',monospace; font-size:.6rem; font-weight:700; padding:1px 4px; border-radius:3px; }
        .fav-chip .fc-time.now { background:var(--green); color:var(--bg); }
        .fav-chip .fc-time.soon { background:rgba(255,179,71,.15); color:var(--amber); }
        .fav-chip .fc-time.later { background:rgba(255,255,255,.04); color:var(--text2); }
        .fav-chip .fc-dir { font-size:.5rem; font-weight:600; opacity:.6; }
        .fav-chip .fc-dir.left { color:var(--left); }
        .fav-chip .fc-dir.right { color:var(--right); }
        .fav-chip .fc-empty { font-size:.6rem; color:var(--text3); }

        /* ── Tabs ── */
        .tabs { display:flex; gap:8px; padding:14px 16px 0; }
        .tab { flex:1; padding:12px 0; border:1.5px solid var(--border); border-radius:var(--radius); cursor:pointer; font-family:inherit; font-size:.8rem; font-weight:600; background:var(--card); color:var(--text2); transition:all .3s cubic-bezier(.4,0,.2,1); text-align:center; position:relative; overflow:hidden; }
        .tab .ln { font-size:.95rem; font-weight:800; display:block; letter-spacing:-0.02em; }
        .tab .lr { font-size:.58rem; font-weight:400; color:var(--text3); margin-top:1px; display:block; }
        .tab:hover { border-color:rgba(255,255,255,.1); }
        .tab.active { border-color:rgba(0,224,158,.25); color:var(--text); }
        .tab.active .lr { color:var(--text2); }
        .tab.active::before { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:28px; height:2px; background:var(--green); border-radius:0 0 2px 2px; }
        .tab[data-line="T1"].active { background:var(--t1-dim); border-color:rgba(0,165,194,.3); }
        .tab[data-line="T1"].active::before { background:var(--t1); }
        .tab[data-line="T2"].active { background:var(--t2-dim); border-color:rgba(0,109,120,.35); }
        .tab[data-line="T2"].active::before { background:var(--t2); }

        /* ── Traffic ── */
        .traffic-banner { margin:12px 16px 0; background:var(--red-dim); border:1px solid rgba(255,107,107,.12); border-radius:var(--radius-sm); padding:8px 12px; display:none; font-size:.72rem; color:rgba(255,255,255,.65); line-height:1.4; }
        .traffic-banner.show { display:flex; gap:8px; align-items:flex-start; }
        .traffic-banner strong { color:var(--red); }

        /* ── Directions ── */
        .dir-bar { display:flex; justify-content:space-between; align-items:center; padding:12px 16px 6px; gap:8px; }
        .dir-tag { font-family:'Space Mono',monospace; font-size:.54rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:4px 8px; border-radius:5px; white-space:nowrap; }
        .dir-tag.left { background:var(--left-dim); color:var(--left); }
        .dir-tag.right { background:var(--right-dim); color:var(--right); }
        .dir-sep { flex:1; height:1px; background:var(--border); }

        /* ══════════════════════════════════════════
           STATIONS - TABLE for guaranteed alignment
           ══════════════════════════════════════════ */
        .stations-wrap { padding:0 10px; }
        .stations { background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
        .s-table { width:100%; border-collapse:collapse; }
        .s-table td { padding:0; vertical-align:middle; }

        /* Station row */
        .s-row { cursor:pointer; transition:background .15s; }
        .s-row:hover { background:rgba(255,255,255,.015); }
        .s-row.nearest { background:rgba(0,224,158,.04); }
        .s-row td { border-bottom:1px solid var(--border); }

        /* ── Times cells ── */
        .times { display:flex; gap:3px; flex-wrap:wrap; align-items:center; padding:6px 8px; }
        .times.left { justify-content:flex-end; }
        .times.right { justify-content:flex-start; }
        .time-chip {
            font-family:'Space Mono',monospace; font-size:.68rem; font-weight:700;
            padding:2px 6px; border-radius:5px; line-height:1.3; white-space:nowrap;
        }
        .time-chip.now { background:var(--green); color:var(--bg); }
        .time-chip.soon { background:rgba(255,179,71,.15); color:var(--amber); }
        .time-chip.later { background:rgba(255,255,255,.04); color:var(--text2); }
        .time-chip .dest-hint { font-size:.48rem; font-weight:400; color:var(--text3); display:block; line-height:1; }
        .time-chip.now .dest-hint { color:rgba(0,0,0,.5); }
        .time-chip.soon .dest-hint { color:rgba(255,179,71,.4); }
        .no-data { font-size:.55rem; color:var(--text3); }

        /* ── Track cells (vertical line + dot) ── */
        .td-track { width:24px; position:relative; }
        .track {
            position:relative; width:24px; height:46px;
        }
        .track::before {
            content:''; position:absolute;
            top:0; bottom:0; left:50%;
            width:2px; transform:translateX(-50%);
            opacity:.2;
        }
        .track.left::before { background:var(--left); }
        .track.right::before { background:var(--right); }
        /* Trim first/last */
        .s-row.first-row .track::before { top:50%; }
        .s-row.last-row .track::before { bottom:50%; }
        /* Direction arrows on all tracks */
        .track::after {
            position:absolute; left:50%; transform:translateX(-50%);
            font-size:5px; z-index:3; opacity:.3;
        }
        .track.left::after {
            content:'▲'; top:3px; color:var(--left);
        }
        .track.right::after {
            content:'▼'; bottom:3px; color:var(--right);
        }
        .dot {
            position:absolute; top:50%; left:50%;
            transform:translate(-50%,-50%);
            width:8px; height:8px; border-radius:50%;
            background:var(--card); border:2px solid;
            z-index:2; transition:all .4s cubic-bezier(.4,0,.2,1);
        }
        .dot.left { border-color:rgba(255,159,67,.35); }
        .dot.right { border-color:rgba(95,108,245,.35); }
        .dot.active { width:13px; height:13px; background:var(--green); border-color:var(--green); box-shadow:0 0 12px var(--green-glow); }

        /* ── Station name cell ── */
        .td-name { text-align:center; }
        .station-name {
            font-size:.73rem; font-weight:500;
            padding:8px 4px; line-height:1.15;
            color:var(--text); transition:all .2s;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
            max-width:130px; display:inline-block;
        }
        .station-name.highlight { color:var(--green); font-weight:700; }
        .s-row.nearest .station-name { color:var(--green); }
        .station-name .fav-star { font-size:.55rem; margin-left:2px; color:var(--amber); opacity:0; transition:opacity .2s; }
        .s-row:hover .fav-star, .station-name .fav-star.on { opacity:1; }

        /* ── Detail Panel row ── */
        .detail-wrap td { padding:0; border-bottom:1px solid var(--border); }
        .detail-panel {
            max-height:0; overflow:hidden;
            transition:max-height .35s cubic-bezier(.4,0,.2,1);
            background:var(--bg2);
        }
        .detail-panel.open { max-height:260px; }
        .detail-inner { padding:10px 14px 12px; }
        .detail-section { margin-bottom:8px; }
        .detail-label { font-size:.55rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; font-weight:600; }
        .detail-row { display:flex; align-items:center; gap:8px; padding:3px 0; font-size:.72rem; }
        .detail-row .dr-time { font-family:'Space Mono',monospace; font-weight:700; min-width:32px; }
        .detail-row .dr-dest { color:var(--text2); }
        .detail-row .dr-badge { font-size:.5rem; padding:1px 5px; border-radius:3px; font-weight:600; }
        .dr-badge.gps { background:var(--green-dim); color:var(--green); }
        .dr-badge.theo { background:rgba(255,255,255,.04); color:var(--text3); }
        .dr-badge.crowd-0 { background:var(--green-dim); color:var(--green); }
        .dr-badge.crowd-1 { background:rgba(255,179,71,.1); color:var(--amber); }
        .dr-badge.crowd-2 { background:var(--red-dim); color:var(--red); }
        .detail-actions { display:flex; gap:8px; margin-top:4px; }
        .detail-actions button { font-family:inherit; font-size:.65rem; padding:5px 12px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--text2); cursor:pointer; transition:all .2s; }
        .detail-actions button:hover { color:var(--text); border-color:var(--border2); }
        .detail-actions button.faved { border-color:rgba(255,179,71,.3); color:var(--amber); background:rgba(255,179,71,.06); }

        /* ── Loading ── */
        #stateContainer { padding:60px 20px; text-align:center; }
        .state-icon { font-size:2rem; margin-bottom:14px; }
        .state-title { font-size:.95rem; font-weight:600; margin-bottom:4px; }
        .state-desc { font-size:.75rem; color:var(--text2); }
        .loader { width:80px; height:2px; background:var(--card2); border-radius:2px; margin:16px auto 0; overflow:hidden; }
        .loader::after { content:''; display:block; width:35%; height:100%; background:var(--green); border-radius:2px; animation:load-slide 1.4s ease-in-out infinite; }
        @keyframes load-slide { 0%{transform:translateX(-100%);} 100%{transform:translateX(380%);} }
        .no-service { text-align:center; padding:20px 16px 0; display:none; }
        .no-service.show { display:block; }
        .no-service p { font-size:.72rem; color:var(--text2); line-height:1.5; }

        /* ── Controls ── */
        .controls { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; }
        .refresh-btn { display:flex; align-items:center; gap:5px; padding:8px 16px; background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); font-family:inherit; font-size:.72rem; font-weight:500; cursor:pointer; transition:all .2s; }
        .refresh-btn:hover { border-color:var(--border2); background:var(--card2); }
        .refresh-btn:active { transform:scale(.97); }
        .refresh-btn.loading { opacity:.5; pointer-events:none; }
        .refresh-btn .spin { display:none; width:12px; height:12px; border:2px solid var(--text3); border-top-color:var(--green); border-radius:50%; animation:spin .7s linear infinite; }
        .refresh-btn.loading .spin { display:inline-block; }
        .refresh-btn.loading .ricon { display:none; }
        @keyframes spin { to{transform:rotate(360deg);} }
        .debug-toggle { font-size:.65rem; color:var(--text3); cursor:pointer; padding:6px 8px; border-radius:6px; border:none; background:none; font-family:inherit; transition:all .2s; }
        .debug-toggle:hover { color:var(--text2); background:rgba(255,255,255,.03); }

        /* ── Legend + Credits ── */
        .legend { display:flex; justify-content:center; gap:14px; padding:2px 16px 6px; flex-wrap:wrap; }
        .legend-item { display:flex; align-items:center; gap:4px; font-size:.58rem; color:var(--text3); }
        .legend-dot { width:6px; height:6px; border-radius:50%; }
        .legend-dot.g { background:var(--green); box-shadow:0 0 5px var(--green-glow); }
        .legend-dot.o { background:var(--left); }
        .legend-dot.b { background:var(--right); }
        .credits { text-align:center; padding:4px 16px 12px; font-size:.55rem; color:var(--text3); }
        .credits a { color:var(--text2); text-decoration:none; }

        /* ── Conn log ── */
        .conn-log { margin:0 10px 14px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); font-family:'Space Mono',monospace; font-size:.58rem; max-height:0; overflow:hidden; transition:max-height .4s cubic-bezier(.4,0,.2,1); }
        .conn-log.open { max-height:350px; overflow-y:auto; }
        .conn-log-inner { padding:12px; }
        .conn-title { font-family:'Outfit',sans-serif; font-weight:600; font-size:.68rem; margin-bottom:6px; color:var(--text2); }
        .conn-entry { padding:2px 0; border-bottom:1px solid var(--border); line-height:1.5; display:flex; gap:5px; align-items:flex-start; }
        .conn-entry:last-child { border:none; }
        .conn-time { color:var(--text3); white-space:nowrap; flex-shrink:0; }
        .conn-status { flex-shrink:0; width:14px; text-align:center; }
        .conn-msg { color:var(--text2); word-break:break-all; }
        .conn-msg.dim { color:var(--text3); }
        .conn-msg.ok { color:var(--green); }
        .conn-msg.err { color:var(--red); }
        .conn-msg.warn { color:var(--left); }

        /* ── Responsive ── */
        @media(max-width:420px) {
            .times { padding:4px 4px; }
            .station-name { font-size:.66rem; max-width:100px; }
            .time-chip { font-size:.62rem; padding:2px 5px; }
            .dir-tag { font-size:.48rem; }
        }
        .s-row { animation:row-in .3s ease-out both; }
        @keyframes row-in { from{opacity:0;transform:translateY(5px);} to{opacity:1;transform:translateY(0);} }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="brand">
            <div class="brand-icon">🚊</div>
            <div><h1>Ginko Tram</h1><div class="sub">Besançon — temps réel</div></div>
        </div>
        <div class="header-right">
            <a class="hdr-btn info" href="https://www.ginko.voyage/info-trafic" target="_blank" title="Info trafic">⚠ Info trafic</a>
            <button class="hdr-btn" id="geoBtn" onclick="toggleGeo()" title="Me localiser">📍</button>
            <div class="live-dot" id="liveDot"></div>
            <span class="update-time" id="updateInfo">—</span>
        </div>
    </div>

    <div class="fav-bar" id="favBar">
        <div class="fav-bar-title">★ Favoris</div>
        <div class="fav-chips" id="favChips"></div>
    </div>

    <div class="tabs">
        <button class="tab active" data-line="T1" onclick="selectLine('T1',this)"><span class="ln">T1</span><span class="lr">Hauts du Chazal ↔ Chalezeule</span></button>
        <button class="tab" data-line="T2" onclick="selectLine('T2',this)"><span class="ln">T2</span><span class="lr">Hauts du Chazal ↔ Gare Viotte</span></button>
    </div>

    <div id="trafficBanner" class="traffic-banner"><span>⚠</span> <span id="trafficText"></span></div>

    <div class="dir-bar">
        <div class="dir-tag left" id="dirLeft">← Hauts du Chazal</div>
        <div class="dir-sep"></div>
        <div class="dir-tag right" id="dirRight">Chalezeule →</div>
    </div>

    <div id="stateContainer">
        <div class="state-icon">🚊</div>
        <div class="state-title">Connexion en cours…</div>
        <div class="state-desc">Récupération des temps de passage</div>
        <div class="loader"></div>
    </div>

    <div class="stations-wrap">
        <div class="stations" id="stationsWrap" style="display:none;">
            <table class="s-table"><tbody id="stationsBody"></tbody></table>
        </div>
    </div>

    <div class="no-service" id="noService"><p>Aucun tram en circulation.<br>Service : ~5h–0h30 (dim 5h30–23h30)</p></div>

    <div class="controls">
        <button class="refresh-btn" id="refreshBtn" onclick="refreshData()"><span class="ricon">↻</span><span class="spin"></span> Actualiser</button>
        <button class="debug-toggle" onclick="toggleLog()">Diagnostic ▾</button>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-dot g"></div>À quai</div>
        <div class="legend-item"><div class="legend-dot o"></div>← Ouest</div>
        <div class="legend-item"><div class="legend-dot b"></div><span id="legendRight">Est →</span></div>
    </div>
    <div class="credits">Données <a href="https://opendata.besancon.fr" target="_blank">Ginko / Besançon Mobilités</a></div>

    <div class="conn-log" id="connLog">
        <div class="conn-log-inner">
            <div class="conn-title">Journal de connexion</div>
            <div id="connEntries"></div>
        </div>
    </div>
</div>

<script>

var $=function(id){return document.getElementById(id);};
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[-\s]+/g,' ').trim();}
function findStation(name){
    var n=norm(name);
    if(stationData[n])return stationData[n];
    var keys=Object.keys(stationData);
    // Try: API key ends with our name (handles "commune name" prefix)
    for(var k=0;k<keys.length;k++){
        var key=keys[k];
        // key ends with n, preceded by space or start
        if(key.length>n.length && key.substring(key.length-n.length)===n && key.charAt(key.length-n.length-1)===' ') return stationData[key];
    }
    return null;
}

/* ── Favorites ── */
function getFavs(){try{return JSON.parse(localStorage.getItem('ginko-favs'))||[];}catch(e){return [];}}
function setFavs(f){localStorage.setItem('ginko-favs',JSON.stringify(f));}
function isFav(name){return getFavs().indexOf(name)>=0;}
function toggleFav(name){
    var f=getFavs(),i=f.indexOf(name);
    if(i>=0)f.splice(i,1); else f.push(name);
    setFavs(f); renderFavBar(); buildStations();
}
function renderFavBar(){
    var f=getFavs(),bar=$('favBar'),chips=$('favChips');
    if(!f.length){bar.classList.remove('show');return;}
    bar.classList.add('show'); chips.innerHTML='';
    var line=LINES[currentLine];
    var lShort=line.leftDir.length>10?line.leftDir.substring(0,8)+'…':line.leftDir;
    var rShort=line.rightDir.length>10?line.rightDir.substring(0,8)+'…':line.rightDir;
    f.forEach(function(name){
        var d=findStation(name);

        chip.onclick=function(){scrollToStation(name);};

            if(d.left.length){
                var t=d.left[0], m=Math.round(t.min), cls=m<=1?'now':m<=5?'soon':'later';
                html+='<span class="fc-dir left">←'+lShort+'</span><span class="fc-time '+cls+'">'+(m<=1?'⇢':m+"'")+'</span> ';
            }
            if(d.right.length){
                var t=d.right[0], m=Math.round(t.min), cls=m<=1?'now':m<=5?'soon':'later';
                html+='<span class="fc-dir right">'+rShort+'→</span><span class="fc-time '+cls+'">'+(m<=1?'⇢':m+"'")+'</span>';
            }

        chip.innerHTML=html;
        chips.appendChild(chip);

function scrollToStation(name){
    var line=LINES[currentLine],idx=line.stations.indexOf(name);
    if(idx<0)return;
    var row=$('sr-'+idx);
    if(row)row.scrollIntoView({behavior:'smooth',block:'center'});

/* ── Geolocation ── */
function toggleGeo(){
    if(geoActive){stopGeo();return;}
    if(!navigator.geolocation){logConn('warn','Géoloc non disponible','warn');return;}
    geoActive=true; $('geoBtn').classList.add('active');
    logConn('info','Géolocalisation activée…','dim');
    geoWatchId=navigator.geolocation.watchPosition(onGeoPos,onGeoErr,{enableHighAccuracy:true,maximumAge:15000,timeout:10000});
}
window.toggleGeo=toggleGeo;
function stopGeo(){
    geoActive=false; $('geoBtn').classList.remove('active');
    if(geoWatchId!==null){navigator.geolocation.clearWatch(geoWatchId);geoWatchId=null;}
    nearestIdx=-1;
    document.querySelectorAll('.s-row.nearest').forEach(function(r){r.classList.remove('nearest');});
}
function onGeoPos(pos){
    var lat=pos.coords.latitude,lng=pos.coords.longitude;
    var line=LINES[currentLine],bestDist=Infinity,bestIdx=-1;
    line.stations.forEach(function(name,i){
        var c=COORDS[name];if(!c)return;
        var d=haversine(lat,lng,c[0],c[1]);
        if(d<bestDist){bestDist=d;bestIdx=i;}
    });
    nearestIdx=bestIdx;
    document.querySelectorAll('.s-row').forEach(function(r,i){r.classList.toggle('nearest',i===bestIdx);});
    if(bestIdx>=0){
        logConn('ok','Station proche: '+line.stations[bestIdx]+' ('+Math.round(bestDist)+'m)','ok');
    }
}
function onGeoErr(e){logConn('warn','Géoloc: '+e.message,'warn');}
function haversine(lat1,lon1,lat2,lon2){
    var R=6371000,r=Math.PI/180,dLat=(lat2-lat1)*r,dLon=(lon2-lon1)*r;
    var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ── Log ── */
window.toggleLog=function(){logOpen=!logOpen;$('connLog').classList.toggle('open',logOpen);};
function logConn(s,m,c){var e=$('connEntries');if(!e)return;var t=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});var ic=s==='ok'?'✅':s==='err'?'❌':s==='warn'?'⚠️':'ℹ️';var d=document.createElement('div');d.className='conn-entry';d.innerHTML='<span class="conn-time">'+t+'</span><span class="conn-status">'+ic+'</span><span class="conn-msg '+(c||'')+'">'+m+'</span>';e.appendChild(d);e.parentElement.scrollTop=e.parentElement.scrollHeight;}
function workerFetch(url){return new Promise(function(ok,ko){var t=setTimeout(function(){ko(new Error('Timeout'));},TIMEOUT);fetch(url).then(function(r){clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(ok).catch(function(e){clearTimeout(t);ko(e);});});}

/* ══════════════════════════════════════════
   BUILD STATIONS (TABLE rows)
   ══════════════════════════════════════════ */
function buildStations(){
    var line=LINES[currentLine],body=$('stationsBody'),len=line.stations.length;
    body.innerHTML=''; openDetail=-1;
    line.stations.forEach(function(name,i){
        var fav=isFav(name);
        var cls='s-row';
        if(i===0) cls+=' first-row';
        if(i===len-1) cls+=' last-row';
        if(i===nearestIdx) cls+=' nearest';
        var tr=document.createElement('tr');
        tr.className=cls; tr.id='sr-'+i;
        tr.style.animationDelay=(i*12)+'ms';
        tr.onclick=function(e){if(e.target.closest('.detail-panel'))return;toggleDetail(i);};
        tr.innerHTML=
            '<td><div class="times left" id="tl-'+i+'"><span class="no-data">—</span></div></td>'+
            '<td class="td-track"><div class="track left"><div class="dot left" id="dl-'+i+'"></div></div></td>'+
            '<td class="td-name"><div class="station-name" id="sn-'+i+'">'+name+'<span class="fav-star'+(fav?' on':'')+'">★</span></div></td>'+
            '<td class="td-track"><div class="track right"><div class="dot right" id="dr-'+i+'"></div></div></td>'+
            '<td><div class="times right" id="tr-'+i+'"><span class="no-data">—</span></div></td>';
        body.appendChild(tr);
        // Detail row
        var dtr=document.createElement('tr');
        dtr.className='detail-wrap';
        dtr.innerHTML='<td colspan="5"><div class="detail-panel" id="dp-'+i+'"><div class="detail-inner" id="di-'+i+'"></div></div></td>';
        body.appendChild(dtr);
    });
}

function toggleDetail(idx){
    if(openDetail>=0&&openDetail!==idx){var prev=$('dp-'+openDetail);if(prev)prev.classList.remove('open');}
    var panel=$('dp-'+idx);if(!panel)return;
    var isOpen=panel.classList.contains('open');
    panel.classList.toggle('open');
    openDetail=isOpen?-1:idx;
    if(!isOpen)renderDetail(idx);
}

function renderDetail(idx){
    var line=LINES[currentLine],name=line.stations[idx],d=findStation(name);
    var inner=$('di-'+idx);if(!inner)return;
    var fav=isFav(name),html='';
    html+='<div class="detail-section"><div class="detail-label">← '+line.leftDir+'</div>';
    if(d&&d.left.length){d.left.forEach(function(t){
        var cls=t.min<=1?'now':t.min<=5?'soon':'later';
        html+='<div class="detail-row"><span class="dr-time time-chip '+cls+'">'+(t.min<=0?'⇢':Math.round(t.min)+"'")+'</span><span class="dr-dest">'+t.dest+'</span>';
        html+=t.fiable?'<span class="dr-badge gps">GPS</span>':'<span class="dr-badge theo">Théo.</span>';
        if(t.charge>=0){var cc=t.charge<30?'crowd-0':t.charge<70?'crowd-1':'crowd-2';var cl=t.charge<30?'Peu fréquenté':t.charge<70?'Fréquenté':'Très fréquenté';html+='<span class="dr-badge '+cc+'">'+cl+'</span>';}
        html+='</div>';
    });}else{html+='<div class="detail-row"><span class="no-data">Aucun passage prévu</span></div>';}
    html+='</div>';
    html+='<div class="detail-section"><div class="detail-label">'+line.rightDir+' →</div>';
    if(d&&d.right.length){d.right.forEach(function(t){
        var cls=t.min<=1?'now':t.min<=5?'soon':'later';
        html+='<div class="detail-row"><span class="dr-time time-chip '+cls+'">'+(t.min<=0?'⇢':Math.round(t.min)+"'")+'</span><span class="dr-dest">'+t.dest+'</span>';
        html+=t.fiable?'<span class="dr-badge gps">GPS</span>':'<span class="dr-badge theo">Théo.</span>';
        if(t.charge>=0){var cc=t.charge<30?'crowd-0':t.charge<70?'crowd-1':'crowd-2';var cl=t.charge<30?'Peu fréquenté':t.charge<70?'Fréquenté':'Très fréquenté';html+='<span class="dr-badge '+cc+'">'+cl+'</span>';}
        html+='</div>';
    });}else{html+='<div class="detail-row"><span class="no-data">Aucun passage prévu</span></div>';}
    html+='</div>';
    html+='<div class="detail-actions"><button class="'+(fav?'faved':'')+'" onclick="event.stopPropagation();toggleFav(\''+name.replace(/'/g,"\\'")+'\')">'+(fav?'★ Retirer des favoris':'☆ Ajouter aux favoris')+'</button></div>';
    inner.innerHTML=html;
}
window.toggleFav=toggleFav;

/* ── Fetch ── */
function fetchAllTimes(){
    var line=LINES[currentLine],noms=line.stations.join(',');
    var url=WORKER+'?method=batch&noms='+encodeURIComponent(noms)+'&ligne='+line.id+'&nb=3';
    logConn('info','Batch '+currentLine+' ('+line.stations.length+' stations)…','dim');
    return workerFetch(url).then(function(data){
        if(!data.ok)throw new Error(data.msg||'Erreur');
        stationData={};
        function processDir(dir,side){
            if(!dir||!dir.ok||!dir.objets)return;
            dir.objets.forEach(function(lieu){
                var key=norm(lieu.nomExact);
                if(!stationData[key])stationData[key]={left:[],right:[]};
                (lieu.listeTemps||[]).forEach(function(t){
                    stationData[key][side].push({min:t.tempsEnMinute,dest:t.destination||'?',fiable:t.fiable!==false,charge:typeof t.tauxDeCharge==='number'?t.tauxDeCharge:-1});
                });
            });
        }
        processDir(data.aller,'right');
        processDir(data.retour,'left');
        var apiKeys=Object.keys(stationData);
        logConn('info','API keys: '+apiKeys.join(', '),'dim');
        var okCount=0;
        line.stations.forEach(function(name,i){
            var d=findStation(name);
            if(d&&(d.left.length||d.right.length)){
                d.left.sort(function(a,b){return a.min-b.min;});
                d.right.sort(function(a,b){return a.min-b.min;});
                renderTimes('tl-'+i,'dl-'+i,d.left);
                renderTimes('tr-'+i,'dr-'+i,d.right);
                var n=$('sn-'+i);
                if(n)n.classList.toggle('highlight',!!(d.left.length&&d.left[0].min<=1)||!!(d.right.length&&d.right[0].min<=1));
                okCount++;
            }else{
                renderTimes('tl-'+i,'dl-'+i,[]);renderTimes('tr-'+i,'dr-'+i,[]);
                var nn=norm(name),close=apiKeys.filter(function(k){return k.indexOf(nn)>=0||nn.indexOf(k)>=0;});
                logConn('warn','∅ "'+name+'" → "'+nn+'"'+(close.length?' ~ API: "'+close.join('","')+'"':' (aucun match API)'),'warn');
            }
            if(openDetail===i)renderDetail(i);
        });
        renderFavBar();
        logConn('ok',okCount+'/'+line.stations.length+' stations','ok');
        return okCount;
    });
}
function renderTimes(tid,did,times){
    var te=$(tid),de=$(did);if(!te||!de)return;
    if(!times.length){te.innerHTML='<span class="no-data">—</span>';de.classList.remove('active');return;}
    te.innerHTML=times.slice(0,2).map(function(t){
        var c=t.min<=1?'now':t.min<=5?'soon':'later';
        var label=t.min<=1?'⇢':Math.round(t.min)+"'";
        var sd=t.dest.length>12?t.dest.substring(0,11)+'…':t.dest;
        return '<span class="time-chip '+c+'">'+label+'<span class="dest-hint">'+sd+'</span></span>';
    }).join('');
    de.classList.toggle('active',times[0].min<=1);
}

/* ── Countdown ── */
var countdownTimer=null;
function startCountdown(){
    if(countdownTimer)clearInterval(countdownTimer);
    countdownTimer=setInterval(function(){
        var line=LINES[currentLine];
        line.stations.forEach(function(name){
            var d=findStation(name);if(!d)return;
            d.left.forEach(function(t){if(t.min>0)t.min=Math.max(0,t.min-1/6);});
            d.right.forEach(function(t){if(t.min>0)t.min=Math.max(0,t.min-1/6);});
        });
        line.stations.forEach(function(name,i){
            var d=findStation(name);
            if(d&&(d.left.length||d.right.length)){renderTimes('tl-'+i,'dl-'+i,d.left);renderTimes('tr-'+i,'dr-'+i,d.right);}
        });
    },10000);
}

/* ── Line switch ── */
window.selectLine=function(line,btn){
    if(line===currentLine&&$('stationsBody').childNodes.length>0)return;
    currentLine=line;
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
    btn.classList.add('active');
    var info=LINES[line];
    $('dirLeft').textContent='← '+info.leftDir;
    $('dirRight').textContent=info.rightDir+' →';
    $('legendRight').textContent=info.rightDir+' →';
    $('trafficBanner').classList.remove('show');
    buildStations();refreshData();fetchTrafficInfo();
    if(geoActive&&geoWatchId!==null){navigator.geolocation.getCurrentPosition(onGeoPos,function(){},{maximumAge:15000});}
};

window.refreshData=function(){
    if(isLoading)return;isLoading=true;
    $('refreshBtn').classList.add('loading');
    fetchAllTimes().then(function(ok){
        $('stationsWrap').style.display='block';
        $('stateContainer').style.display='none';
        $('noService').classList.toggle('show',ok===0);
        $('liveDot').classList.toggle('offline',ok===0);
        $('updateInfo').textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
        startCountdown();
    }).catch(function(e){
        logConn('err',e.message,'err');
        $('updateInfo').textContent='Erreur';
        $('liveDot').classList.add('offline');
    }).finally(function(){isLoading=false;$('refreshBtn').classList.remove('loading');});
};

function fetchTrafficInfo(){
    workerFetch(WORKER+'?method=etat').then(function(data){
        if(!data.ok||!data.objets)return;
        var lineId=LINES[currentLine].id;
        var etat=data.objets.find(function(e){return e.idLigne===lineId;});
        if(etat&&etat.etat>0&&etat.etat!==4){
            var msgs={1:'Perturbation mineure',2:'Perturbation modérée',3:'Perturbation majeure',5:'Service interrompu',6:'Service non assuré'};
            $('trafficText').innerHTML='<strong>'+(etat.numLignePublic||currentLine)+'</strong> — '+(msgs[etat.etat]||'État '+etat.etat);
            $('trafficBanner').classList.add('show');
        }else{$('trafficBanner').classList.remove('show');}
    }).catch(function(){});
}

function init(){
    logConn('info','<b>v17</b> — TABLE layout + TR/getListeTemps','');
    renderFavBar();
    var testUrl=WORKER+'?method=temps&nom='+encodeURIComponent('République')+'&ligne=101&sens=false&nb=3';
    workerFetch(testUrl).then(function(data){
        if(!data.ok)throw new Error(data.msg);
        var nb=0;if(data.objets)data.objets.forEach(function(l){nb+=(l.listeTemps||[]).length;});
        logConn('ok','API OK — '+nb+' passages test','ok');
    }).catch(function(e){logConn('err',e.message,'err');}).then(function(){
        buildStations();refreshData();fetchTrafficInfo();
        if(refreshTimer)clearInterval(refreshTimer);
        refreshTimer=setInterval(refreshData,REFRESH);
        setInterval(fetchTrafficInfo,120000);
    });
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){});}
})();
